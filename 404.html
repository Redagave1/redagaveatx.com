<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Page Not Found | Red Agave</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:'Montserrat';font-style:normal;font-weight:300 700;font-display:swap;src:url(/fonts/montserrat-latin-normal.woff2) format('woff2')}
:root{--gold:#c9a84c;--dark:#080b06;--cream:#f0ead6}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;background:var(--dark);color:var(--cream);font-family:'Montserrat',sans-serif;padding:24px}
main{max-width:620px;margin:0 auto}
.eye{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
h1{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(48px,10vw,84px);line-height:.95;letter-spacing:1px;margin-bottom:20px}
p{font-size:15px;line-height:1.8;color:rgba(240,234,214,.65);margin-bottom:28px;font-weight:300}
nav{display:flex;flex-wrap:wrap;gap:12px}
a{color:var(--gold);border:1px solid rgba(201,168,76,.3);padding:10px 22px;font-size:11px;letter-spacing:2px;text-transform:uppercase;text-decoration:none}
a:hover{background:rgba(201,168,76,.1)}
</style>
</head>
<body>
<main>
  <div class="eye">404</div>
  <h1>This Page Isn't Here</h1>
  <p>The link may be old. Everything we build is one click away.</p>
  <nav>
    <a href="/">Home</a>
    <a href="/services">Services</a>
    <a href="/featured">Projects</a>
    <a href="/contact">Contact</a>
  </nav>
</main>
</body>
</html>
